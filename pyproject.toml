[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcode"
version = "0.1.0"
description = "Deterministic 3D terrain maps for unfamiliar codebases"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
terrain = [
    "torch==2.5.1",
    "transformers==4.44.2",
    "numpy==1.26.4",
    "umap-learn==0.5.7",
    "scikit-learn==1.5.2",
    "einops==0.8.1",
]
ts = [
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
]
languages = [
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java==0.23.5",
    "tree-sitter-c==0.24.2",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-haskell==0.23.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
flowcode = "flowcode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
